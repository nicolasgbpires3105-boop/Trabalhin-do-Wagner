<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Sentai:Battle Card</title>
</head>
<!-- Link para o arquivo de estilização do CSS -->
<link rel="stylesheet" href="css/styles.css">

<body>     

  <!-- Início do container principal -->
  <section class="memory-game">    
  
    <!-- Início das seções dos cards - 12 cards (cartões)-->
    <section class="memory-card" data-framework="Ryuranger">
      <!-- O que são Data Attributes?
        São atributos criados por você no HTML para guardar informações extras em uma tag 
        sem precisar criar classes ou IDs.Exemplo no HTML:<div data-status="ativo" 
        data-cor="azul">Texto</div>-->
      <img class="front-face" src="img/Super Sentai LOgo.png" alt="Super Sentai" />
      <img class="back-face" src="img/Ryuranger.png" alt="Ryuranger" />
    </section>

    <section class="memory-card" data-framework="Red Ranger">
      <img class="front-face" src="img/Super Sentai LOgo.png" alt="Super Sentai" />
      <img class="back-face" src="img/Red Ranger.jpg" alt="Red Ranger" />
    </section>

    <section class="memory-card" data-framework="Gokai Red">
      <img class="front-face" src="img/Super Sentai LOgo.png" alt="Super Sentai" />
      <img class="back-face" src="img/Gokai Red.jpg" alt="Gokai Red" />
    </section>

    <section class="memory-card" data-framework="Changeman">
      <img class="front-face" src="img/Super Sentai LOgo.png" alt="Super Sentai" />
      <img class="back-face" src="img/Changeman.jpg" alt="Changeman" />
    </section>

    <section class="memory-card" data-framework="Dragon Ranger">
      <img class="front-face" src="img/Super Sentai LOgo.png" alt="Super Sentai" />
      <img class="back-face" src="img/Dragon Ranger.jpg" alt="Dragon Ranger" />
    </section>

    <section class="memory-card" data-framework="Shinken Red">
      <img class="front-face" src="img/Super Sentai LOgo.png" alt="Super Sentai" />
      <img class="back-face" src="img/Shinken red.jpg" alt="Shinken Red" />
    </section>


    <section class="memory-card" data-framework="Gokai Red">
      <img class="front-face" src="img/Super Sentai LOgo.png" alt="Super Sentai" />
      <img class="back-face" src="img/Gokai Red.jpg" alt="Gokai Red" />
    </section>

    <section class="memory-card" data-framework="Dragon Ranger">
      <img class="front-face" src="img/Super Sentai LOgo.png" alt="Super Sentai" />
      <img class="back-face" src="img/Dragon Ranger.jpg" alt="Dragon Ranger" />
    </section>

    <section class="memory-card" data-framework="Ryuranger">
      <img class="front-face" src="img/Super Sentai LOgo.png" alt="Super Sentai" />
      <img class="back-face" src="img/Ryuranger.png" alt="Ryuranger" />
    </section>

    <section class="memory-card" data-framework="Red Ranger">
      <img class="front-face" src="img/Super Sentai LOgo.png" alt="Super Sentai" />
      <img class="back-face" src="img/Red Ranger.jpg" alt="Red Ranger" />
    </section>

    <section class="memory-card" data-framework="Shinken Red">
      <img class="front-face" src="img/Super Sentai LOgo.png" alt="Super Sentai" />
      <img class="back-face" src="img/Shinken red.jpg" alt="Shinken Red" />
    </section>

    <section class="memory-card" data-framework="Changeman">
      <img class="front-face" src="img/Super Sentai LOgo.png" alt="Super Sentai" />
      <img class="back-face" src="img/Changeman.jpg" alt="Changeman" />
    </section>
    <!-- Fim das seções dos cards-->

  </section>
  <!-- Fim do container principal -->

  <!-- Link para o arquivo Javascript, que será iniciado na próxima semana -->
  <script src="js/script.js"></script>
</body>
</html>
